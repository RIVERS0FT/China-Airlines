name: Materialize reviewed v0.3 source edits
on:
  push:
    branches: [feat/fleet-plans-v03]
    paths: [scripts/assemble-v03.py, .github/workflows/assemble-v03.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/feat/fleet-plans-v03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fleet-plans-v03
      - name: Apply only hash-checked source edits
        run: python3 scripts/assemble-v03.py
      - name: Commit exact edits and remove the one-time assembler
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/App.tsx src/ui/AviationScene.tsx src/ui/Panels.tsx src/core/legacy.ts package.json package-lock.json e2e/orders.spec.ts tests/orders.test.ts docs/PLAYING.md docs/DELIVERY.md
          git rm scripts/assemble-v03.py .github/workflows/assemble-v03.yml
          git commit -m 'feat: connect specialist fleet, workshop and plan interfaces'
          git push origin HEAD:feat/fleet-plans-v03
