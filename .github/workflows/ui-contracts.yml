name: UI contracts
on:
  pull_request:
    branches: [main]
    paths:
      - src/ui/**
      - src/main.tsx
      - e2e/**
      - .github/workflows/ui-contracts.yml
      - .github/workflows/ci.yml
permissions:
  contents: read
concurrency:
  group: ui-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_PATH: /china-airlines/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install CJK fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Check common containers and browser interaction
        run: npx playwright test e2e/flows e2e/presentation/flight-animation.spec.ts e2e/presentation/start-map-i18n.spec.ts e2e/presentation/ui-workspace.spec.ts e2e/presentation/navigation-stability.spec.ts e2e/functional/browse-ux.spec.ts e2e/functional/energy.spec.ts e2e/functional/flight-board.spec.ts e2e/functional/fleet-entry.spec.ts e2e/functional/game.spec.ts e2e/functional/organization.spec.ts
      - name: Upload compact browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-contract-reports
          path: artifacts/browser-subpath.json
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-contract-evidence
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 3
