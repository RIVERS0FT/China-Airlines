name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Audit development and runtime dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=moderate --json > artifacts/npm-audit-all.json
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('artifacts/npm-audit-all.json','utf8')); if(!report.metadata?.vulnerabilities) throw new Error('Audit service did not return a vulnerability report'); console.log(report.metadata.vulnerabilities);"
          npm audit --omit=dev --audit-level=moderate --json > artifacts/npm-audit-runtime.json
      - name: Typecheck
        run: npm run typecheck
      - name: Domain and persistence tests
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/unit-tests.json
      - name: Production build (portable root)
        run: npm run build
      - name: Install Chromium and system fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p artifacts
      - name: Browser verification (root)
        run: npm run test:e2e
      - name: Production build (GitHub Pages subpath)
        env:
          BASE_PATH: /China-Airlines/
        run: npm run build
      - name: Browser verification (subpath)
        env:
          BASE_PATH: /China-Airlines/
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-airlines-verification
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
