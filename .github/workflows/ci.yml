name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.name }}, shard ${{ matrix.shard }}/4)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            base_path: ''
            shard: 1
          - name: root
            base_path: ''
            shard: 2
          - name: root
            base_path: ''
            shard: 3
          - name: root
            base_path: ''
            shard: 4
          - name: subpath
            base_path: /china-airlines/
            shard: 1
          - name: subpath
            base_path: /china-airlines/
            shard: 2
          - name: subpath
            base_path: /china-airlines/
            shard: 3
          - name: subpath
            base_path: /china-airlines/
            shard: 4
    env:
      BASE_PATH: ${{ matrix.base_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Audit development and runtime dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=moderate --json > artifacts/npm-audit-all.json
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('artifacts/npm-audit-all.json','utf8')); if(!report.metadata?.vulnerabilities) throw new Error('Audit service did not return a vulnerability report'); console.log(report.metadata.vulnerabilities);"
          npm audit --omit=dev --audit-level=moderate --json > artifacts/npm-audit-runtime.json
      - name: Typecheck
        run: npm run typecheck
      - name: Unit functions, company lifecycle and persistence tests
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/unit-tests.json
      - name: Production build (${{ matrix.name }})
        run: npm run build
      - name: Install Chromium and system fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p artifacts
      - name: Browser verification (${{ matrix.name }})
        # One browser per runner avoids competing software WebGL renderers.
        # All four shards are required; no test filters or reduced assertions.
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: Record failed verification context
        if: failure()
        run: |
          mkdir -p test-results
          node -e "require('node:fs').writeFileSync('test-results/failure-context.json', JSON.stringify({runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sha:process.env.GITHUB_SHA,job:process.env.GITHUB_JOB}))"
      - name: Upload failed verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}-ci-${{ matrix.name }}-${{ matrix.shard }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 90
