name: Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: delivery-ready
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, china-airlines-center]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check center artifact storage
        run: node .github/scripts/center-artifacts.cjs check
      - name: Install exact locked dependencies once
        run: npm ci --prefer-offline --no-audit
      - name: Audit development and runtime dependencies
        run: |
          mkdir -p artifacts
          npm audit --audit-level=moderate --json > artifacts/npm-audit-all.json
          node --input-type=module -e "import fs from 'node:fs'; const report=JSON.parse(fs.readFileSync('artifacts/npm-audit-all.json','utf8')); if(!report.metadata?.vulnerabilities) throw new Error('Audit service did not return a vulnerability report'); console.log(report.metadata.vulnerabilities);"
          npm audit --omit=dev --audit-level=moderate --json > artifacts/npm-audit-runtime.json
      - name: Typecheck
        run: npm run typecheck
      - name: Unit functions, company lifecycle and persistence tests
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/unit-tests.json
      - name: Verify locked Chromium and provisioned system dependencies
        run: node scripts/prepare-browser.mjs
      - name: Relative-path production build
        run: npm run build
      - name: Full browser verification including UI contracts
        run: npm run test:e2e
      - name: Record complete verification identity
        if: github.event_name == 'pull_request'
        run: node .github/scripts/verification-receipt.cjs save
      - name: Save failed verification evidence on center
        if: failure()
        run: node .github/scripts/center-artifacts.cjs save-failure ci-full
