name: Verify and package
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies (bootstrap only when absent)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Preserve initial dependency lock on the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/single-player-mvp'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock verified dependency resolution'
            git push origin HEAD:feat/single-player-mvp
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Domain and persistence tests
        run: npm test
      - name: Production build (portable root)
        run: npm run build
      - name: Install Chromium and system fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p artifacts
      - name: Browser verification (root)
        run: npm run test:e2e
      - name: Production build (GitHub Pages subpath)
        env:
          BASE_PATH: /China-Airlines/
        run: npm run build
      - name: Browser verification (subpath)
        env:
          BASE_PATH: /China-Airlines/
        run: npm run test:e2e
      - name: Package portable static build and source
        run: |
          npm run build
          git archive --format=zip --prefix=China-Airlines/ HEAD > artifacts/china-airlines-source.zip
          (cd dist && zip -qr ../artifacts/china-airlines-web.zip .)
          printf 'Validated source commit: %s\n' "$(git rev-parse HEAD)" > artifacts/BUILD.txt
      - name: Upload delivery and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-airlines-delivery
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
