name: Materialize reviewed v0.4 edits
on:
  push:
    branches: [feat/crew-retirement-v04]
permissions:
  contents: write
jobs:
  materialize:
    if: "github.event.head_commit.message == 'build: materialize reviewed v0.4 edits'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crew-retirement-v04
      - name: Apply checked source edits and remove the one-time writer
        run: |
          python scripts/materialize-v04.py
          git rm scripts/materialize-v04.py .github/workflows/materialize-v04.yml
          git add src tests e2e package.json package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: connect dispatcher contracts, safe resale and guided first flight'
          git push origin HEAD:feat/crew-retirement-v04
