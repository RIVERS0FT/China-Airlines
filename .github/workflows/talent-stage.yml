name: Prepare approved talent implementation
on:
  push:
    branches: ['feat/company-talent-life']
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: stage approved talent implementation'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply reviewed source changes on the feature branch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const parts = Array.from({length:7},(_,i)=>`scripts/talent-stage-${i}.bin`);
          const compressed = Buffer.concat(parts.map(p=>fs.readFileSync(p)));
          if (createHash('sha256').update(compressed).digest('hex') !== '563deae9e4bfc31f736c7cfcf5fcc8d4f90f86f4f1d3024404f83d9706286602') throw new Error('Source transfer checksum mismatch');
          const plan = JSON.parse(brotliDecompressSync(compressed).toString('utf8'));
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if (git('merge-base',plan.base,'HEAD') !== plan.base) throw new Error('Unexpected feature base; refusing to overwrite parallel work');
          if (git('rev-parse','HEAD:src/core/v8') !== 'f9488bc18353ae0aae5e54718351e3e70a29d480') throw new Error('Frozen v8 tree mismatch');
          const safe=p=>{if(p.includes('..')||!(/^(src|tests|e2e|docs)\//.test(p)||p==='README.md'))throw new Error('Unexpected path');return p;};
          fs.writeFileSync('/tmp/talent.patch',plan.patch);
          execFileSync('git',['apply','--check','/tmp/talent.patch'],{stdio:'inherit'});
          execFileSync('git',['apply','/tmp/talent.patch'],{stdio:'inherit'});
          for(const [file,content] of Object.entries(plan.files)){safe(file);fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,content);}
          for(const [file,prefix] of Object.entries(plan.prepend)){
            safe(file);const old=fs.readFileSync(file,'utf8');
            if(file==='README.md'){const end=old.indexOf('\n');fs.writeFileSync(file,old.slice(0,end+1)+'\n'+prefix+old.slice(end+1));}
            else fs.writeFileSync(file,prefix+old);
          }
          for(const item of plan.insert){safe(item.path);const old=fs.readFileSync(item.path,'utf8');if(old.split(item.anchor).length!==2)throw new Error('Insert anchor mismatch');fs.writeFileSync(item.path,old.replace(item.anchor,item.anchor+item.text));}
          for(const file of parts)fs.rmSync(file);
          NODE
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src tests e2e docs README.md scripts
          git commit -m 'feat: add persistent company talent and portrait organization'
      - name: Push only the prepared feature commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/feat/company-talent-life
