name: UI source review
on:
  push:
    branches: [refactor/unified-ui-shell]
    paths: [.github/workflows/ui-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect tracked source only
        shell: bash
        run: |
          mkdir -p review
          for pair in base:e21a0efb1bd4cbafa327d4b409eddf384eedb16b ui:da905d69e6805b1d870ae9cfe66a83cabec9a0eb main:origin/main; do
            name=${pair%%:*}
            ref=${pair#*:}
            git rev-parse "$ref" > "review/$name.commit"
            git ls-tree -r "$ref" > "review/$name.tree"
            git archive --format=tar "$ref" AGENTS.md README.md docs src tests e2e scripts .github package.json package-lock.json tsconfig.json playwright.config.ts postcss.config.cjs vite.config.ts vitest.config.ts index.html | gzip > "review/$name.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ui-source-review
          path: review/
          retention-days: 1
