name: Prepare offline UI dependencies
on:
  push:
    branches: [feat/dispatch-minimal-screen]
    paths: [.github/workflows/dispatch-local-deps.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: tar -czf ui-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-ui-dependencies
          path: ui-dependencies.tar.gz
          retention-days: 1
