name: Retain latest failure evidence
on:
  workflow_run:
    workflows: [Verify, Deploy China Airlines production, UI contracts]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged cleanup only executes default-branch code, never PR artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { prune } = require('./.github/scripts/artifact-retention.cjs');
            await prune({ github, context, core });
