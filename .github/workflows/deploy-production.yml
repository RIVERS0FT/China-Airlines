name: Deploy China Airlines production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main revision requested by the delivery controller
        required: false
        type: string
      delivery_pr:
        description: Delivery PR number
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: china-airlines-production
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare verified game
    if: github.repository == 'meviu523/China-Airlines' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, china-airlines-center]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check center artifact storage
        run: node .github/scripts/center-artifacts.cjs check
      - name: Load deployment configuration
        id: target
        run: node scripts/deployment-config.mjs
      - name: Reject superseded or mismatched delivery
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Install exact locked dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Verify locked Chromium and provisioned system dependencies
        run: node scripts/prepare-browser.mjs
      - name: Reuse only identical fully verified PR content
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verification-receipt.cjs reuse
      - name: Full verification when no matching receipt exists
        if: steps.verification.outputs.reused != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e
      - name: Build the exact main revision for production
        if: steps.verification.outputs.reused == 'true'
        run: npm run build
      - name: Check current main and package this revision
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$main_sha" = "$GITHUB_SHA"
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          if find dist -type l -print -quit | grep -q .; then
            echo 'Release contains a symbolic link' >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > dist/release.txt
          tar -C dist -czf "$RUNNER_TEMP/china-airlines.tgz" .
          (cd "$RUNNER_TEMP" && sha256sum china-airlines.tgz > china-airlines.tgz.sha256)
      - name: Save verified release on center
        run: node .github/scripts/center-artifacts.cjs save-release
      - name: Save failed verification evidence on center
        if: failure()
        run: node .github/scripts/center-artifacts.cjs save-failure production

  deploy:
    name: Deploy verified game
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: [self-hosted, Linux, X64, china-airlines-center]
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.publish.outputs.public_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify release from center
        run: node .github/scripts/center-artifacts.cjs restore-release
      - name: Load deployment configuration
        run: node scripts/deployment-config.mjs
      - name: Prepare public browser acceptance
        run: |
          npm ci --prefer-offline --no-audit
          node scripts/prepare-browser.mjs
      - name: Check current main and extract the verified build
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'meviu523/China-Airlines'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$RUNNER_NAME" = "$CENTER_RUNNER"
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          cd "$RUNNER_TEMP/china-airlines-artifact"
          sha256sum --check --strict china-airlines.tgz.sha256
          release_directory="$(mktemp -d "$RUNNER_TEMP/china-airlines-platform-XXXXXXXX")"
          tar -xzf china-airlines.tgz -C "$release_directory" --no-same-owner --no-same-permissions
          printf 'RELEASE_DIRECTORY=%s\n' "$release_directory" >> "$GITHUB_ENV"
      - name: Publish through riversoft.top and verify homepage catalog
        id: publish
        env:
          RIVERSOFT_TOKEN: ${{ secrets.RIVERSOFT_TOKEN }}
        run: node scripts/publish-riversoft.mjs
      - name: Verify public assets and platform deployment identity
        env:
          RIVERSOFT_TOKEN: ${{ secrets.RIVERSOFT_TOKEN }}
        run: node scripts/verify-production.mjs
      - name: Public browser acceptance including offline and save restore
        run: npx playwright test --config playwright.production.config.ts
      - name: Save failed deployment evidence on center
        if: failure()
        run: node .github/scripts/center-artifacts.cjs save-failure deploy
      - name: Record public acceptance
        run: |
          {
            echo '### China Airlines production'
            echo
            echo "- Game revision: \`$GITHUB_SHA\`"
            echo "- URL: $PUBLIC_URL"
            echo '- Release: uploaded and committed through riversoft.top HTTPS hosting API'
            echo '- Public checks: homepage catalog and every published file match this deployment'
            echo '- Public browser acceptance: new company, save restore, offline start and responsive layouts passed'
          } >> "$GITHUB_STEP_SUMMARY"
